<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>csv-to-geojson demo map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  header { padding: 8px 14px; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  p { margin: 0; font-size: .9rem; }
  #map { height: calc(100vh - 82px); }
</style>
</head>
<body>
<header>
  <h1>csv-to-geojson: eight world cities</h1>
  <p>Points produced by running csv-to-geojson on <code>examples/cities.csv</code>
  (approximate city centres). Source:
  <a href="https://github.com/AmmarYasser455/csv-to-geojson">AmmarYasser455/csv-to-geojson</a>.</p>
</header>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([20, 10], 2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  fetch('demo.geojson').then(function (r) { return r.json(); }).then(function (data) {
    L.geoJSON(data, {
      onEachFeature: function (f, layer) {
        layer.bindPopup(f.properties.city + ', ' + f.properties.country);
      }
    }).addTo(map);
  });
</script>
</body>
</html>
