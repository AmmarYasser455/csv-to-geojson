[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-to-geojson"
version = "0.1.0"
description = "Turn a CSV with coordinates into GeoJSON, auto-detecting latitude/longitude columns and reporting unparsable rows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
csv-to-geojson = "csv_to_geojson.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
